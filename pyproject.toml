[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vimms-lair-downloader"
version = "0.1.0"
description = "CLI downloader for Vimm's Lair ROM vault"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5",
    "rich>=13",
    "click>=8",
    "python-dotenv>=1",
    "anyio>=4",
]

[project.scripts]
vimms = "vimms_downloader.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["vimms_downloader"]


[tool.hatch.envs.default]
type = "virtual"
