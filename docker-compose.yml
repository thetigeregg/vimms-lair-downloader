services:
  vimms:
    image: vimm:latest
    pull_policy: never
    container_name: vimms-lair-downloader
    # Match your DSM user's uid:gid so downloaded files aren't owned by root
    # (also applies to `docker exec`, not just the main process).
    # Find it over SSH with: id <your-dsm-username>
    user: "1026:100"
    environment:
      - DOWNLOAD_DIR=/roms
      - ARIA2_CONNECTIONS=1
      - HTTP_TIMEOUT=30
      - TZ=Etc/UTC
    volumes:
      # EDIT: point this at a real DSM shared folder (create it in
      # File Station / Control Panel first if it doesn't exist yet).
      - /volume1/docker/vimms-lair/roms:/roms
    restart: unless-stopped
